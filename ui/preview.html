<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подстрочник</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="window">

  <!-- ШАПКА -->
  <header class="titlebar" data-drag>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94e2d5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12.6c0 3.1-2.9 5.6-6.5 5.6-.7 0-1.4-.1-2-.3L7.6 20v-2.6C5.4 16.5 4 14.7 4 12.6 4 9.5 6.9 7 10.5 7s6.5 2.5 6.5 5.6Z"/>
        <path d="M14.5 5.6C13.9 3.9 11.9 2.7 9.5 2.7 6.4 2.7 4 4.7 4 7.2c0 1.5.9 2.8 2.3 3.6"/>
      </svg>
    </div>
    <div class="titles">
      <h1>Подстрочник</h1>
      <span>перевод выделенного текста на ходу</span>
    </div>
    <div class="win-buttons">
      <button class="win-btn" data-win="min" aria-label="Свернуть" title="Свернуть в трей">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button class="win-btn" data-win="max" aria-label="Развернуть" title="Развернуть">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <button class="win-btn close" data-win="close" aria-label="Закрыть" title="Скрыть в трей">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <!-- ТЕЛО -->
  <div class="body">

    <div class="source">
      <textarea id="src" placeholder="Исходный текст — печатай или вставляй. Enter переводит, Shift+Enter — новая строка"></textarea>
    </div>

    <div class="translate-head">
      <div class="mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94e2d5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h11l-3-3M20 16H9l3 3"/>
        </svg>
        <span id="mode-text">Перевод (автоопределение → русский)</span>
      </div>
      <div class="row-actions">
        <button class="pill pill-primary" id="btn-src-translate" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.5l1.7 4.3 4.3 1.7-4.3 1.7L12 15.5l-1.7-4.3L6 9.5l4.3-1.7zM18 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/>
          </svg>
          <span id="btn-src-translate-text">Перевести этот текст</span>
        </button>
        <button class="pill pill-green" id="btn-clip">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 3.2h6v3H9z"/><path d="M9 11h6M9 15h4"/>
          </svg>
          <span id="btn-clip-text">Перевести из буфера</span>
        </button>
        <button class="pill pill-peach" id="btn-copy" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 5.5 15"/>
          </svg>
          Скопировать
        </button>
      </div>
    </div>

    <div class="status-line" id="status"></div>

    <!-- Карточка перевода -->
    <section class="card translate">
      <div class="card-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a6e3a1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.6 2.6L16 9.6"/>
        </svg>
        <span class="card-title">Перевод:</span>
        <span class="when" id="tr-time" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
          <span id="tr-time-text"></span>
        </span>
      </div>
      <div class="card-body" id="tr-text"><span class="empty">Здесь появится перевод</span></div>
      <div class="card-foot">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#74c7ec" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M3.5 9.5h17M3.5 14.5h17M12 3.2c2.4 2.6 3.6 5.5 3.6 8.8S14.4 18.2 12 20.8c-2.4-2.6-3.6-5.5-3.6-8.8S9.6 5.8 12 3.2Z"/>
        </svg>
        <span id="tr-foot" class="empty">Ожидание перевода</span>
      </div>
    </section>

    <!-- Чат -->
    <section class="card chat">
      <div class="chat-head">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#cba6f7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12.8c0 3.4-3.4 6.2-7.6 6.2-.8 0-1.6-.1-2.3-.3L6 21v-3c-1.9-1.1-3-2.9-3-5.2C3 9.4 6.4 6.6 10.6 6.6S20 9.4 20 12.8Z" transform="translate(1 .5)"/>
        </svg>
        <p>Чат: пиши по-русски — ответ придёт на языке собеседника и по-русски ниже</p>
      </div>
      <div class="chat-body" id="chat-body"></div>

      <div class="compose">
        <div class="compose-field">
          <button class="compose-icon" id="btn-paste" title="Вставить текст из буфера">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11.5l-7.6 7.6a4.2 4.2 0 0 1-6-6l7.5-7.5a2.9 2.9 0 0 1 4.1 4.1l-7.4 7.5a1.6 1.6 0 0 1-2.3-2.3l6.7-6.8"/>
            </svg>
          </button>
          <textarea id="inp" rows="1" placeholder="Написать в чат — Enter отправляет, Shift+Enter новая строка"></textarea>
          <button class="compose-icon" id="btn-screen" title="Распознать текст с области экрана в поле ввода">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2.5v14.5a1 1 0 0 0 1 1h14.5M2.5 6h14.5a1 1 0 0 1 1 1v14.5"/>
            </svg>
          </button>
          <button class="compose-send" id="btn-send" title="Отправить (Enter)" disabled>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M6 11l6-6 6 6"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

  </div>

  <!-- ФУТЕР -->
  <footer class="footer">
    <div class="hotkeys">
      <div class="hk" title="Два быстрых нажатия Ctrl+C — перевести то, что сейчас в буфере">
        <kbd>Ctrl</kbd><span class="plus">+</span><kbd>C</kbd><span class="badge">×2</span>
        перевести из буфера
      </div>
      <div class="hk" title="Выделить область экрана и перевести текст с неё">
        <kbd>Ctrl</kbd><span class="plus">+</span><kbd>Alt</kbd><span class="plus">+</span><kbd>S</kbd>
        перевод с экрана
      </div>
    </div>

    <div class="context">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#cba6f7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4.2a3.4 3.4 0 0 0-3.4 3.4A3 3 0 0 0 6.2 13a3.2 3.2 0 0 0 2 5.8 2.8 2.8 0 0 0 2.6 1.4M12 4.2a3.4 3.4 0 0 1 3.4 3.4A3 3 0 0 1 17.8 13a3.2 3.2 0 0 1-2 5.8 2.8 2.8 0 0 1-2.6 1.4M12 4.2v16"/>
      </svg>
      <span>Контекст:</span>
      <span class="dot" id="ctx-dot"></span>
      <b id="ctx-text">0 / 50 000</b>
    </div>

    <button class="ghost" id="btn-reset" title="Удалить весь контекст сессии">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19.6 4.6V9h-4.4"/>
      </svg>
      Сбросить контекст
    </button>

    <button class="icon-btn" id="btn-autostart" title="Запускать с Windows" aria-label="Запускать с Windows">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.8l4.4 4.4L19 7.6"/></svg>
    </button>
  </footer>

</div>
<script>window.__forceDemo = true;</script>
<script src="app.js"></script>
</body>
</html>
